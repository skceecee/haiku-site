<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Poppy Blooms Haiku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
    <main>
    <h1>A Poppy Blooms Haiku</h1>
    <div class="content">
        <section class="haiku">
    <p class="haiku-text">I write, erase, rewrite <br>
       Erase again, and then <br>
       A poppy blooms.
       </p>
       <p class="author">Katsushika Hokusai</p>
      </section>
    
        <figure class="image">
    <img src="img/1st prompt.png" alt="AI generated image of poppy flower rising out of journal">
</figure> 
           </div>
         </main>
      </div>
</body>
</html>
